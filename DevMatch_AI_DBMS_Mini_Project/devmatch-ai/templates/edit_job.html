{% extends 'base.html' %}{% block title %}Edit job · DevMatch AI{% endblock %}{% block content %}<div class="page-header"><div class="eyebrow dark">MANAGE OPPORTUNITY</div><h1>Edit job<span class="accent-dot">.</span></h1><p>Update the listing details below.</p></div><section class="surface narrow"><form method="post" class="stack-form"><input type="hidden" name="csrf" value="{{csrf}}"><label>Job title<input name="title" value="{{job.title}}" required></label><label>Description<textarea name="description" rows="5" required>{{job.description}}</textarea></label><label>Required skills (comma-separated)<input name="required_skills" value="{{job.required_skills}}" required></label><div class="form-grid"><label>Location<input name="location" value="{{job.location}}"></label><label>Salary<input name="salary" value="{{job.salary}}"></label><label>Experience<input name="experience_required" value="{{job.experience_required}}"></label><label>Job type<select name="job_type">{% for kind in ['Full-time','Internship','Part-time','Contract'] %}<option {{'selected' if job.job_type==kind}}>{{kind}}</option>{% endfor %}</select></label><label>Deadline<input name="deadline" type="date" value="{{job.deadline or ''}}"></label></div><div class="row-actions"><button class="button small">Save changes</button><a href="{{url_for('dashboard')}}#jobs">Cancel</a></div></form></section>{% endblock %}
